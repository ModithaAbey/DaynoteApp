name: Build Android APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm install

      # `cap add android` only creates the android/ folder if it doesn't
      # already exist — safe to run every time, and covers the case
      # where the folder was never committed to the repo.
      - name: Ensure native Android project exists
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      # Makes the built APK downloadable from the workflow run's summary
      # page (Actions tab -> this run -> Artifacts section), instead of
      # it only existing on the CI runner's disk (which gets thrown away
      # once the job finishes).
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daynote-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
