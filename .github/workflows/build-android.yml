name: Build Android APK
# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch:
# Lets this workflow create/update GitHub Releases (needed for the
# "Publish APK to a permanent Release" step below).
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install npm dependencies
        run: npm install
      # Pinned to the 6.x line specifically, because @capacitor/core in
      # this project is on version 6 -- the plugin's 7.x/8.x releases
      # require @capacitor/core 7+/8+ and fail to install here otherwise.
      - name: Install Firebase Authentication plugin
        run: npm install @capacitor-firebase/authentication@6
      # `cap add android` only creates the android/ folder if it doesn't
      # already exist -- safe to run every time, and covers the case
      # where the folder was never committed to the repo. IMPORTANT: the
      # android/ folder must NOT exist in the repo at all (not even
      # partially, e.g. just holding google-services.json) -- if it does,
      # this check skips regenerating it and every later step that
      # expects a full native project (AndroidManifest.xml etc.) fails.
      - name: Ensure native Android project exists
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      # Uses a fixed debug keystore (committed at repo root as
      # daynote-debug.keystore) instead of the default one Gradle would
      # otherwise auto-generate fresh on every run. Without this, the
      # APK's signing certificate -- and therefore its SHA-1 fingerprint
      # -- would be different every build, breaking Google Sign-In (which
      # is registered against one fixed SHA-1 in the Firebase console)
      # after every single rebuild.
      - name: Use our fixed debug keystore (so SHA-1 stays the same every build)
        run: |
          mkdir -p ~/.android
          cp daynote-debug.keystore ~/.android/debug.keystore
      # Copies the Firebase config (committed at repo root as
      # google-services.json) into the native project so the Google
      # Services Gradle plugin below can pick it up at build time.
      - name: Add Firebase config to the native project
        run: cp google-services.json android/app/google-services.json
      # Wires up the Google Services Gradle plugin, which reads
      # google-services.json and generates the resources the Firebase
      # Authentication native SDK needs (client IDs etc.) -- required for
      # native Google Sign-In to work at all.
      - name: Apply the Google Services Gradle plugin
        run: |
          sed -i "/classpath 'com.android.tools.build:gradle/a\\    classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
      - name: Sync web assets into the native project
        run: npx cap sync android
      # Grants exact-time alarm scheduling automatically at install, with
      # no settings-screen toggle for the user to find at all. This is
      # USE_EXACT_ALARM rather than SCHEDULE_EXACT_ALARM specifically:
      # SCHEDULE_EXACT_ALARM requires the user to manually enable an
      # "Alarms & reminders" toggle that different phone brands place in
      # inconsistent, sometimes hard-to-find locations (and Samsung's
      # One UI hides the toggle entirely until the app has explicitly
      # requested it via an intent, which this app's code doesn't do).
      # USE_EXACT_ALARM sidesteps all of that by being auto-granted --
      # its only restriction is a Play Store listing policy, which
      # doesn't apply here since this APK is sideloaded, not published
      # to Play. `cap add android` regenerates AndroidManifest.xml from
      # scratch each time, so this has to be patched in on every build
      # rather than committed once. The grep check makes this safe to
      # re-run even if the permission is ever added to a committed
      # manifest later.
      - name: Add exact-alarm permission to Android manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "USE_EXACT_ALARM" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <application#' "$MANIFEST"
          fi
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      # Makes the built APK downloadable from the workflow run's summary
      # page (Actions tab -> this run -> Artifacts section), instead of
      # it only existing on the CI runner's disk (which gets thrown away
      # once the job finishes). This copy requires being logged into
      # GitHub and expires after 90 days -- kept here as a quick way to
      # grab a single run's APK, but the Release step below is what the
      # app's own "Install" button should link to.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daynote-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Publishes the same APK to a GitHub Release tagged "latest",
      # replacing whatever was there before. This gives a permanent,
      # no-login-required download URL that never changes between
      # builds, which is what makes it safe to hardcode in the app's
      # "Install" button:
      #   https://github.com/<owner>/<repo>/releases/download/latest/app-debug.apk
      - name: Publish APK to a permanent Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically published from commit ${{ github.sha }}.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
